<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AI Cloud Album</title>
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<body>
        <div class="layout-container">
        <!-- Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>AI Album</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" onclick="goHome()">
                    <i class="fa fa-home"></i>
                    <span>HOME</span>
                </button>
                <button class="nav-item" onclick="goUpload()">
                    <i class="fa fa-upload"></i>
                    <span>UPLOAD</span>
                </button>
                <button class="nav-item" onclick="goDownload()">
                    <i class="fa fa-download"></i>
                    <span>DOWNLOAD</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search Bar -->
            <header class="top-header" style="height: 62px;">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search photo ..." oninput="searchPhotos()">
                </div>
                <div class="user-area">
                    <span id="userName" style="margin-right: 16px; font-size: 15px; color: #333;"></span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </header>

            <!-- Album -->
            <div class="container">
                <div class="album" id="album"></div>
            </div>
        </main>
    </div>

    <script src="../static/js/main.js"></script>
</body>
</html>
