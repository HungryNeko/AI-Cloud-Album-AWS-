<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Upload Image</title>
    <link rel="stylesheet" href="../static/css/upload.css">
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<body>
    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>AI Album</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item" onclick="goHome()">
                    <i class="fa-home"></i>
                    <span>HOME</span>
                </button>
                <button class="nav-item active" onclick="goUpload()">
                    <i class="fa-upload"></i>
                    <span>UPLOAD</span>
                </button>
                <button class="nav-item" onclick="goDownload()">
                    <i class="fa-download"></i>
                    <span>DOWNLOAD</span>
                </button>
                <button class="nav-item" onclick="goMapView()">
                    <i class="fa fa-mapView"></i>
                    <span>MapView</span>
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header" style="height: 62px;">
                <div class="user-area">
                    <span id="userName" style="margin-right: 16px; font-size: 15px; color: #333;"></span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </header>

            <div class="upload-wrapper">
                <div class="upload-dropzone" id="dropzone">
                    <p>Upload your photo here ...</p>
                    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.zip">
                </div>
                <div class="upload-queue">
                    <h3>Upload List</h3>
                    <div id="fileQueue"></div>
                </div>
            </div>
            <button class="upload-btn" onclick="startUpload()">Upload</button>
        </main>
    </div>

    <script src="../static/js/upload.js"></script>
</body>
</html>
