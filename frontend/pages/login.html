<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Cloud Album</title>
    <link rel="stylesheet" href="../static/css/auth.css">
</head>

<body>
    <div class="auth-container">
        <h2>AI Cloud Album</h2>

        <!--Account Login-->
        <div class="form-box" id="loginBox">
            <h3>Login</h3>
            <input type="text" id="useremail" placeholder="Use Email to Login" required>
            <input type="password" id="userpassword" placeholder="Password" required>
            <button onclick="login()">Login</button>
            <a href="javascript:switchToRegister()">Register</a>
        </div>

        <!--Register Account-->
        <div class="form-box hidden" id="registerBox">
            <h3>Register</h3>
            <input type="text" id="reg_useremail" placeholder="Enter Your Email" required>
            <input type="password" id="reg_userpassword" placeholder="Enter Password" required>
            <button onclick="register()">Register</button>
            <a href="javascript:switchToLogin()">Login</a>
        </div>

        <div id="msg" class="message"></div>
    </div>

    <script src="../static/js/auth.js"></script>
</body>
</html>
